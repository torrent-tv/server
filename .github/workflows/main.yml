name: Main

# Every push to main runs the checks and then the release. The version is the newest
# v* tag plus the step the Conventional Commits since it ask for; the release builds
# and pushes the container image, tags the merged commit and creates the GitHub
# release from the changesets (nothing is committed to main), writes the version and
# digest into torrent-tv/infra (which deploys it on the droplet), and waits until the
# live site reports the new version.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Least release step (a feat still releases minor)
        type: choice
        options: [auto, patch, minor]
        default: auto

permissions:
  contents: read

env:
  IMAGE: ghcr.io/torrent-tv/server
  SITE: https://webauth.courses

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    # The commit check lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    # A newer push to a pull request makes its older checks pointless; every push to
    # main gets a group of its own, so no check of main is ever replaced.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || format('checks-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # One step per check, so the run shows which check ran and which one failed.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Commit messages follow Conventional Commits
        uses: wagoid/commitlint-github-action@v6.2.1
      - name: No secrets in commits
        uses: torrent-tv/workflows/actions/check-secrets@main
      - name: Branch name names a task
        if: github.event_name == 'pull_request'
        run: '[[ "$GITHUB_HEAD_REF" =~ ^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)/ttv-[1-9][0-9]*-[a-z0-9][a-z0-9.-]*$ ]]'
      # actionlint 1.7.12 predates three documented things; drop each ignore once
      # actionlint knows it: the `queue` key of `concurrency` (queue: max keeps every
      # pending run), the `ubuntu-26.04` runner label, and the `client-id` input of
      # actions/create-github-app-token, which replaces `app-id`.
      # The runner passes `args` to docker without shell quoting, so a space inside a
      # pattern is written `\s` and a quote `.` (each pattern is a regular expression).
      - name: Workflows are valid
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: >-
            -color
            -ignore unexpected\skey\s.queue.\sfor\s.concurrency.\ssection
            -ignore label\s.ubuntu-26\.04.\sis\sunknown
            -ignore input\s.client-id.\sis\snot\sdefined\sin\saction\s.actions/create-github-app-token@
            -ignore missing\sinput\s.app-id.\swhich\sis\srequired\sby\saction\s.actions/create-github-app-token@
      - name: Pull request adds a changeset
        uses: torrent-tv/workflows/actions/check-changesets@main
      - name: Install dependencies
        run: npm ci
      - name: Lint and tests
        run: npm test

  # The image checks itself in its final stage (`server.js --check`), so a
  # pull request whose image cannot load the server fails here, before the
  # release pushes it.
  build:
    name: Image build
    needs: checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the image for amd64
        run: docker build -t torrent-tv-server .

  release:
    name: Release
    needs: [checks, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: ${{ env.SITE }}
    # Every release runs, one at a time, in the order the runs reach the queue. A later
    # run sees the earlier tag and releases what came after it; a run whose commit a
    # tag already holds only finishes what is missing.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The version is the newest v* tag plus the step the commits ask for; it is
      # written into package.json and package-lock.json of this workspace only.
      - id: release
        uses: torrent-tv/workflows/actions/release-plan@main
        with:
          version-files: package.json,package-lock.json
          bump: ${{ inputs.bump || 'auto' }}

      - if: steps.release.outputs.released == 'true' && steps.release.outputs.already != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.release.outputs.released == 'true' && steps.release.outputs.already != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image
        id: build
        if: steps.release.outputs.released == 'true' && steps.release.outputs.already != 'true'
        uses: docker/build-push-action@v7
        with:
          # The workspace, which holds the version release-plan wrote; the Git context
          # would build 0.0.0-development, and that instance stands by behind the
          # serving slot (services/instance-role.js decideOnPeer).
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/workflows/actions/release-tag@main
        with:
          tag: ${{ steps.release.outputs.tag }}
          notes-file: ${{ steps.release.outputs.notes-file }}
          github-token: ${{ github.token }}

      - name: The published image's digest
        id: image
        if: steps.release.outputs.released == 'true'
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # A re-run of a tagged commit built nothing; the registry knows the digest.
          digest="$BUILT"
          if [ -z "$digest" ]; then
            digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Token for infra only
        id: infra-token
        if: steps.release.outputs.released == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: torrent-tv
          repositories: infra
          permission-contents: write
          permission-actions: read

      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/workflows/actions/infra-install-server@main
        with:
          github-token: ${{ steps.infra-token.outputs.token }}
          version: ${{ steps.release.outputs.version }}
          digest: ${{ steps.image.outputs.digest }}
          task: "#ttv-388"
          site: ${{ env.SITE }}
