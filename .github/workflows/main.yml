name: Main

# Every push to main runs the checks and then the release. The release builds and
# pushes the container image when the Conventional Commits since the last tag ask
# for one, writes its version and digest into torrent-tv/infra (which deploys it
# on the droplet), and waits until the live site reports the new version.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Release step
        type: choice
        options: [auto, patch, minor]
        default: auto

permissions:
  contents: read

env:
  IMAGE: ghcr.io/torrent-tv/server
  SITE: https://webauth.courses

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # A newer push to a pull request makes its older checks pointless; every push to
    # main gets a group of its own, so no check of main is ever replaced.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || format('checks-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: torrent-tv/.github/actions/checks@main
        with:
          changelog: CHANGELOG.md
          version-file: package.json

  release:
    name: Release
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE }}
    # Every release runs, one at a time, in the order the runs reach the queue.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: release
        uses: torrent-tv/.github/actions/release-prepare@main
        with:
          version-files: package.json,package-lock.json
          changelog: CHANGELOG.md
          bump: ${{ inputs.bump || 'auto' }}

      - if: steps.release.outputs.released == 'true' && steps.release.outputs.already != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.release.outputs.released == 'true' && steps.release.outputs.already != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image
        id: build
        if: steps.release.outputs.released == 'true' && steps.release.outputs.already != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/.github/actions/release-finish@main
        with:
          tag: ${{ steps.release.outputs.tag }}
          notes-file: ${{ steps.release.outputs.notes-file }}
          github-token: ${{ github.token }}

      - name: The published image's digest
        id: image
        if: steps.release.outputs.released == 'true'
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # A re-run of a published release built nothing; the registry knows the digest.
          digest="$BUILT"
          if [ -z "$digest" ]; then
            digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Token for infra only
        id: infra-token
        if: steps.release.outputs.released == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: torrent-tv
          repositories: infra
          permission-contents: write
          permission-actions: read

      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/.github/actions/infra-install-server@main
        with:
          github-token: ${{ steps.infra-token.outputs.token }}
          version: ${{ steps.release.outputs.version }}
          digest: ${{ steps.image.outputs.digest }}
          task: "#ttv-91"
          site: ${{ env.SITE }}
